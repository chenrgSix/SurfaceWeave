name: Performance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium performance gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.4

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm --filter @surfaceweave/performance-benchmark exec playwright install --with-deps chromium

      - name: Run Chromium benchmark
        run: pnpm benchmark:browser

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-performance
          path: |
            examples/performance-benchmark/benchmark-results
            examples/performance-benchmark/playwright-report
          if-no-files-found: warn
          retention-days: 30

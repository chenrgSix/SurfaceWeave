name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node 22 release gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.4

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm 10 can crash while resolving circular optional peers in the clean
      # Vue/Agentdown consumer. npm/cli#8448 fixes this in npm 11.6.0.
      - name: Pin npm for clean-consumer verification
        run: npm install --global npm@11.6.0 --ignore-scripts --no-audit --no-fund

      - name: Assert cold checkout
        run: |
          if find packages examples -type d -name dist -print -quit | grep -q .; then
            echo "Tracked or restored dist output would invalidate the cold build"
            exit 1
          fi

      - name: Cold build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build documentation
        run: pnpm docs:build

      - name: Test
        run: pnpm test

      - name: Smoke-test performance benchmarks
        run: pnpm benchmark:smoke

      - name: Verify package tarballs
        run: pnpm verify:packages

      - name: Audit release metadata
        run: pnpm audit:release

  tauri:
    name: Tauri cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.4

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust toolchain
        run: rustc --version && cargo --version

      - name: Check Tauri host
        run: pnpm check:tauri

[package]
name = "tea-purchase-tauri"
version = "0.3.0"
description = "Minimal Tauri 2 host for the Package First Dynamic UI tea example"
authors = ["Package First contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tea_purchase_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
